{% extends "base.html" %}
{% block title %}Submitted{% endblock %}
{% block page %}success{% endblock %}
{% block content %}
<section class="card success-card center" id="success-app"
         data-message="Success! Your {{ spec.title }} has been submitted. Your reference number is {{ ref|replace('-', ' ') }}.">
  <div class="success-icon" aria-hidden="true">&#10003;</div>
  <h1>Submitted successfully!</h1>
  <p class="lead">Your {{ spec.title }} has been saved.</p>
  <p class="ref-label">Your reference number</p>
  <p class="ref-number" aria-label="Reference number {{ ref }}">{{ ref }}</p>
  <div class="review-actions center-actions">
    <a class="btn btn-primary btn-large" href="{{ url_for('dashboard') }}">Go to Dashboard</a>
    <a class="btn btn-secondary btn-large" href="{{ url_for('submissions') }}#sub-{{ kind }}-{{ sub_id }}">View Submission</a>
    <button type="button" class="btn btn-ghost btn-large" id="btn-read-success">Read Aloud</button>
  </div>
</section>
{% endblock %}
